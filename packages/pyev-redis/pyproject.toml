[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyev-redis"
version = "0.1.0"
description = "Redis Pub/Sub and Streams transport plugin for pyev"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyev>=0.1.0", "redis>=5.0"]

[project.entry-points."pyev.engines"]
redis = "pyev.engines.redis:RedisEngine"
